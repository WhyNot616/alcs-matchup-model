name: savant probe
# Quick connectivity check: can this runner reach Baseball Savant and the MLB Stats API?
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=$(curl -s -o /tmp/a.csv -w "%{http_code} bytes=%{size_download} secs=%{time_total}" "https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfGT=R%7C&hfSea=2026%7C&player_type=pitcher&game_date_gt=2026-09-01&game_date_lt=2026-09-02&type=details&min_pitches=0&min_results=0&group_by=name&sort_col=pitches&sort_order=desc&min_pas=0")
          echo "::notice title=savant::$S lines=$(wc -l < /tmp/a.csv) head=$(head -c 60 /tmp/a.csv | tr -d '\n\"')"
          M=$(curl -s -o /dev/null -w "%{http_code}" "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=2026-09-01")
          echo "::notice title=statsapi::$M"
