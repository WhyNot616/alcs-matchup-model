name: refresh model

# Pulls the latest Statcast data, rebuilds the model and simulation, and commits the dashboard
# (docs/index.html, served by GitHub Pages) and output/*.json. Run it from the Actions tab
# ("Run workflow"), or let the schedule run it every morning in October.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "league (all pitches, enables the backtest) or teams (faster)"
        default: league
        type: choice
        options: [league, teams]
      n_series:
        description: "simulated series"
        default: "5000"
      bootstrap:
        description: "bootstrap resamples for the uncertainty range"
        default: "20"
  schedule:
    - cron: "0 11 * 10 *"   # 6am Central, every day in October

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore Statcast cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: savant-${{ inputs.scope || 'league' }}-${{ github.run_id }}
          restore-keys: savant-${{ inputs.scope || 'league' }}-
      - name: Pull data (incremental)
        run: python -m alcs_model pull --scope ${{ inputs.scope || 'league' }}
      - name: Save Statcast cache (even if the build fails later)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: savant-${{ inputs.scope || 'league' }}-${{ github.run_id }}
      - name: Build model, simulate, render dashboard
        run: |
          sed -i "s/^  league_scope: .*/  league_scope: ${{ inputs.scope || 'league' }}/" config/series.yaml
          python -m alcs_model build --n ${{ inputs.n_series || '5000' }} --bootstrap ${{ inputs.bootstrap || '20' }}
          git checkout config/series.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: model-output
          path: |
            output/
            docs/index.html
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/index.html output/dashboard_data.json output/backtest.json
          git diff --cached --quiet || git commit -m "Refresh model output ($(date -u +%Y-%m-%d))"
          git push
